<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Tactical FPS</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
}

#menu {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: linear-gradient(135deg, #10151c, #030405);
    color: white;

    display: flex;
    justify-content: center;
    align-items: center;
}

.menu {
    width: 420px;
    padding: 40px;
    text-align: center;

    background: rgba(15,18,22,.95);
    border: 1px solid #555;
    box-shadow: 0 0 60px #000;
}

.menu h1 {
    font-size: 46px;
    margin: 0;
    color: #d99b28;
}

.menu h2 {
    color: #999;
    font-weight: normal;
}

.menu button {
    width: 100%;
    padding: 16px;
    margin-top: 20px;

    border: 0;
    background: #d99b28;

    font-size: 20px;
    font-weight: bold;

    cursor: pointer;
}

.menu button:hover {
    background: #f0b536;
}

.controls {
    color: #aaa;
    line-height: 1.8;
    margin-top: 25px;
}

#hud {
    display: none;

    position: fixed;
    inset: 0;
    z-index: 10;

    pointer-events: none;
    color: white;
}

#crosshair {
    position: absolute;
    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    font-size: 28px;
    font-weight: bold;

    text-shadow: 0 0 5px black;
}

#stats {
    position: absolute;
    bottom: 20px;
    left: 20px;

    padding: 15px 20px;

    background: rgba(0,0,0,.7);

    font-size: 20px;
    line-height: 1.7;
}

#ammo {
    position: absolute;
    right: 25px;
    bottom: 20px;

    padding: 15px 20px;

    background: rgba(0,0,0,.7);

    font-size: 30px;
    font-weight: bold;
}

#weapon {
    position: absolute;

    left: 50%;
    bottom: 5px;

    transform: translateX(-50%);

    font-size: 90px;

    filter: drop-shadow(0 5px 10px black);
}

#error {
    display: none;

    position: fixed;
    inset: 0;
    z-index: 999;

    background: #170000;
    color: white;

    padding: 40px;

    font-family: monospace;
    white-space: pre-wrap;
}
</style>
</head>

<body>

<div id="error"></div>

<div id="menu">

    <div class="menu">

        <h1>TACTICAL FPS</h1>

        <h2>3D BROWSER GAME</h2>

        <button id="startButton">
            НАЧАТЬ ИГРУ
        </button>

        <div class="controls">

            WASD — движение<br>
            SHIFT — бег<br>
            Мышь — обзор<br>
            ЛКМ — стрелять<br>
            R — перезарядка<br>
            ESC — освободить мышь

        </div>

    </div>

</div>


<div id="hud">

    <div id="crosshair">+</div>

    <div id="stats">

        ❤️ <span id="health">100</span><br>

        ☠ Убийства:
        <span id="kills">0</span><br>

        🤖 Ботов:
        <span id="bots">0</span>

    </div>

    <div id="ammo">
        30 / 90
    </div>

    <div id="weapon">
        🔫
    </div>

</div>


<script type="module">

/*
    THREE.JS
*/

import * as THREE from
"https://unpkg.com/three@0.160.0/build/three.module.js";


/* =====================================================
   ПЕРЕМЕННЫЕ
===================================================== */

let scene;
let camera;
let renderer;

let clock;

let walls = [];
let enemies = [];

let keys = {};

let health = 100;
let kills = 0;

let ammo = 30;
let reserve = 90;

let started = false;
let dead = false;

let yaw = 0;
let pitch = 0;


/* =====================================================
   ЗАПУСК
===================================================== */

document
    .getElementById("startButton")
    .addEventListener("click", startGame);


function startGame() {

    document
        .getElementById("menu")
        .style.display = "none";

    document
        .getElementById("hud")
        .style.display = "block";

    started = true;

    init();

    document.body.requestPointerLock();
}


/* =====================================================
   ИНИЦИАЛИЗАЦИЯ
===================================================== */

function init() {

    try {

        scene =
            new THREE.Scene();


        scene.background =
            new THREE.Color(0x15191d);


        scene.fog =
            new THREE.Fog(
                0x15191d,
                10,
                70
            );


        /* КАМЕРА */

        camera =
            new THREE.PerspectiveCamera(
                75,
                window.innerWidth /
                window.innerHeight,
                0.1,
                200
            );


        camera.position.set(
            0,
            1.7,
            25
        );


        /* РЕНДЕР */

        renderer =
            new THREE.WebGLRenderer({
                antialias: true
            });


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );


        renderer.setPixelRatio(
            Math.min(
                window.devicePixelRatio,
                2
            )
        );


        renderer.shadowMap.enabled = true;


        document
            .body
            .appendChild(renderer.domElement);


        /* ВРЕМЯ */

        clock =
            new THREE.Clock();


        createLights();

        createFloor();

        createWalls();

        createEnemies();

        createEvents();

        updateHUD();

        animate();

    }

    catch(error) {

        showError(error);
    }
}


/* =====================================================
   ОШИБКА
===================================================== */

function showError(error) {

    const box =
        document.getElementById("error");

    box.style.display = "block";

    box.textContent =
        "ОШИБКА ИГРЫ:\n\n" +
        error.stack;
}


/* =====================================================
   СВЕТ
===================================================== */

function createLights() {

    const ambient =
        new THREE.AmbientLight(
            0xffffff,
            1.5
        );

    scene.add(ambient);


    const light =
        new THREE.DirectionalLight(
            0xffffff,
            2
        );

    light.position.set(
        10,
        20,
        10
    );

    light.castShadow = true;

    scene.add(light);


    /* Красные лампы */

    for (
        let x = -25;
        x <= 25;
        x += 12
    ) {

        const red =
            new THREE.PointLight(
                0xff4400,
                4,
                18
            );

        red.position.set(
            x,
            4,
            0
        );

        scene.add(red);
    }
}


/* =====================================================
   ПОЛ
===================================================== */

function createFloor() {

    const geometry =
        new THREE.PlaneGeometry(
            70,
            70
        );


    const material =
        new THREE.MeshStandardMaterial({
            color: 0x404346,
            roughness: 1
        });


    const floor =
        new THREE.Mesh(
            geometry,
            material
        );


    floor.rotation.x =
        -Math.PI / 2;


    floor.receiveShadow = true;


    scene.add(floor);


    /* Сетка */

    const grid =
        new THREE.GridHelper(
            70,
            35,
            0x777777,
            0x333333
        );


    grid.position.y = .01;


    scene.add(grid);
}


/* =====================================================
   СТЕНА
===================================================== */

function wall(
    x,
    z,
    width,
    depth
) {

    const geometry =
        new THREE.BoxGeometry(
            width,
            5,
            depth
        );


    const material =
        new THREE.MeshStandardMaterial({
            color: 0x666666
        });


    const object =
        new THREE.Mesh(
            geometry,
            material
        );


    object.position.set(
        x,
        2.5,
        z
    );


    object.castShadow = true;

    object.receiveShadow = true;


    scene.add(object);


    walls.push({
        x: x,
        z: z,
        width: width,
        depth: depth
    });
}


/* =====================================================
   КАРТА
===================================================== */

function createWalls() {

    /* внешняя граница */

    wall(0, -34, 68, 2);

    wall(0, 34, 68, 2);

    wall(-34, 0, 2, 68);

    wall(34, 0, 2, 68);


    /* внутренние */

    wall(-15, -12, 2, 20);

    wall(15, -12, 2, 20);

    wall(-15, 15, 2, 18);

    wall(15, 15, 2, 18);


    wall(-25, 0, 18, 2);

    wall(25, 0, 18, 2);


    wall(0, -20, 18, 2);

    wall(0, 20, 18, 2);
}


/* =====================================================
   БОТ
===================================================== */

function createBot(x, z) {

    const bot =
        new THREE.Group();


    /* НОГИ */

    const pants =
        new THREE.MeshStandardMaterial({
            color: 0x20252b
        });


    const leg1 =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .4,
                1.1,
                .4
            ),
            pants
        );


    leg1.position.set(
        -.23,
        .55,
        0
    );


    const leg2 =
        leg1.clone();


    leg2.position.x =
        .23;


    bot.add(leg1);
    bot.add(leg2);


    /* ТЕЛО */

    const shirt =
        new THREE.MeshStandardMaterial({
            color:
                Math.random() > .5
                ? 0x33495b
                : 0x5b4531
        });


    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.1,
                1.4,
                .6
            ),
            shirt
        );


    body.position.y =
        1.6;


    bot.add(body);


    /* БРОНЕЖИЛЕТ */

    const armor =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .9,
                .85,
                .65
            ),
            new THREE.MeshStandardMaterial({
                color: 0x292d31
            })
        );


    armor.position.set(
        0,
        1.65,
        -.05
    );


    bot.add(armor);


    /* ГОЛОВА */

    const head =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .42,
                16,
                12
            ),
            new THREE.MeshStandardMaterial({
                color: 0xc78b68
            })
        );


    head.position.y =
        2.65;


    bot.add(head);


    /* ВОЛОСЫ */

    const hair =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .44,
                16,
                8,
                0,
                Math.PI * 2,
                0,
                Math.PI / 2
            ),
            new THREE.MeshStandardMaterial({
                color: 0x151515
            })
        );


    hair.position.y =
        2.8;


    bot.add(hair);


    /* ГЛАЗА */

    const eyeMaterial =
        new THREE.MeshBasicMaterial({
            color: 0x222222
        });


    const eye1 =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .05,
                8,
                8
            ),
            eyeMaterial
        );


    eye1.position.set(
        -.15,
        2.67,
        -.39
    );


    const eye2 =
        eye1.clone();


    eye2.position.x =
        .15;


    bot.add(eye1);
    bot.add(eye2);


    /* РУКИ */

    const skin =
        new THREE.MeshStandardMaterial({
            color: 0xc78b68
        });


    const arm1 =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .28,
                1,
                .28
            ),
            skin
        );


    arm1.position.set(
        -.68,
        1.6,
        0
    );


    const arm2 =
        arm1.clone();


    arm2.position.x =
        .68;


    bot.add(arm1);
    bot.add(arm2);


    /* ОРУЖИЕ */

    const gun =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .22,
                .22,
                1.2
            ),
            new THREE.MeshStandardMaterial({
                color: 0x111111,
                metalness: .8
            })
        );


    gun.position.set(
        0,
        1.45,
        -.65
    );


    gun.rotation.x =
        Math.PI / 2;


    bot.add(gun);


    /* ДАННЫЕ */

    bot.position.set(
        x,
        0,
        z
    );


    bot.userData.health = 100;

    bot.userData.speed =
        .025 +
        Math.random() * .02;

    bot.userData.lastShot = 0;

    bot.userData.target =
        new THREE.Vector3(
            x,
            0,
            z
        );


    scene.add(bot);

    enemies.push(bot);
}


/* =====================================================
   СОЗДАНИЕ БОТОВ
===================================================== */

function createEnemies() {

    const positions = [

        [-10, -5],
        [10, -5],
        [-20, 15],
        [20, 15],
        [-10, 25],
        [10, 25]

    ];


    for (
        const position of positions
    ) {

        createBot(
            position[0],
            position[1]
        );
    }
}


/* =====================================================
   ПРОВЕРКА СТЕНЫ
===================================================== */

function blocked(
    x,
    z,
    radius
) {

    for (
        const w of walls
    ) {

        const minX =
            w.x -
            w.width / 2 -
            radius;

        const maxX =
            w.x +
            w.width / 2 +
            radius;

        const minZ =
            w.z -
            w.depth / 2 -
            radius;

        const maxZ =
            w.z +
            w.depth / 2 +
            radius;


        if (
            x > minX &&
            x < maxX &&
            z > minZ &&
            z < maxZ
        ) {

            return true;
        }
    }


    return false;
}


/* =====================================================
   ДВИЖЕНИЕ С КОЛЛИЗИЯМИ
===================================================== */

function moveObject(
    object,
    dx,
    dz,
    radius
) {

    const newX =
        object.position.x + dx;


    if (
        !blocked(
            newX,
            object.position.z,
            radius
        )
    ) {

        object.position.x =
            newX;
    }


    const newZ =
        object.position.z + dz;


    if (
        !blocked(
            object.position.x,
            newZ,
            radius
        )
    ) {

        object.position.z =
            newZ;
    }
}


/* =====================================================
   ИГРОК
===================================================== */

function updatePlayer() {

    const speed =
        keys["ShiftLeft"] ||
        keys["ShiftRight"]
        ? .16
        : .09;


    const forward =
        new THREE.Vector3();


    camera.getWorldDirection(
        forward
    );


    forward.y = 0;

    forward.normalize();


    const right =
        new THREE.Vector3();


    right.crossVectors(
        forward,
        camera.up
    );


    right.normalize();


    let dx = 0;

    let dz = 0;


    if (
        keys["KeyW"]
    ) {

        dx +=
            forward.x *
            speed;

        dz +=
            forward.z *
            speed;
    }


    if (
        keys["KeyS"]
    ) {

        dx -=
            forward.x *
            speed;

        dz -=
            forward.z *
            speed;
    }


    if (
        keys["KeyA"]
    ) {

        dx -=
            right.x *
            speed;

        dz -=
            right.z *
            speed;
    }


    if (
        keys["KeyD"]
    ) {

        dx +=
            right.x *
            speed;

        dz +=
            right.z *
            speed;
    }


    moveObject(
        camera,
        dx,
        dz,
        .5
    );


    camera.position.y =
        1.7;
}


/* =====================================================
   AI БОТОВ
===================================================== */

function updateBots() {

    for (
        const bot of enemies
    ) {

        const target =
            camera.position.clone();


        target.y = 0;


        const direction =
            target.clone()
                .sub(bot.position);


        const distance =
            direction.length();


        direction.normalize();


        /*
            Бот идёт к игроку,
            но moveObject не даст ему
            пройти через стену.
        */

        if (
            distance > 4
        ) {

            moveObject(
                bot,
                direction.x *
                bot.userData.speed,

                direction.z *
                bot.userData.speed,

                .5
            );
        }


        /* смотрит на игрока */

        bot.lookAt(
            camera.position.x,
            bot.position.y,
            camera.position.z
        );


        /* стреляет */

        if (
            distance < 22 &&
            performance.now() -
            bot.userData.lastShot >
            1000
        ) {

            bot.userData.lastShot =
                performance.now();


            botShoot(bot);
        }
    }
}


/* =====================================================
   СТРЕЛЬБА БОТА
===================================================== */

function botShoot(bot) {

    /*
        Простая вероятность попадания.
    */

    const distance =
        bot.position.distanceTo(
            camera.position
        );


    const chance =
        Math.max(
            .15,
            1 -
            distance / 30
        );


    if (
        Math.random() <
        chance
    ) {

        health -=
            8 +
            Math.random() * 7;


        health =
            Math.max(
                0,
                health
            );


        updateHUD();


        if (
            health <= 0
        ) {

            playerDeath();
        }
    }
}


/* =====================================================
   СТРЕЛЬБА ИГРОКА
===================================================== */

function shoot() {

    if (
        !started ||
        dead
    ) return;


    if (
        ammo <= 0
    ) {

        reload();

        return;
    }


    ammo--;


    updateHUD();


    /* луч */

    const ray =
        new THREE.Raycaster();


    ray.setFromCamera(
        new THREE.Vector2(0, 0),
        camera
    );


    const objects = [];


    for (
        const bot of enemies
    ) {

        bot.traverse(
            object => {

                if (
                    object.isMesh
                ) {

                    objects.push(
                        object
                    );
                }
            }
        );
    }


    const hits =
        ray.intersectObjects(
            objects,
            true
        );


    if (
        hits.length === 0
    ) return;


    let bot =
        hits[0].object;


    while (
        bot &&
        !enemies.includes(bot)
    ) {

        bot =
            bot.parent;
    }


    if (!bot) return;


    bot.userData.health -= 50;


    if (
        bot.userData.health <= 0
    ) {

        killBot(bot);
    }
}


/* =====================================================
   УБИЙСТВО
===================================================== */

function killBot(bot) {

    scene.remove(bot);


    enemies =
        enemies.filter(
            b => b !== bot
        );


    kills++;


    updateHUD();


    /*
        БЕСКОНЕЧНЫЕ БОТЫ
    */

    setTimeout(
        spawnNewBot,
        1000
    );
}


/* =====================================================
   НОВЫЙ БОТ
===================================================== */

function spawnNewBot() {

    if (
        dead
    ) return;


    let x;
    let z;


    do {

        x =
            -28 +
            Math.random() *
            56;

        z =
            -28 +
            Math.random() *
            56;

    } while (
        blocked(x,z,.6)
    );


    createBot(
        x,
        z
    );
}


/* =====================================================
   ПЕРЕЗАРЯДКА
===================================================== */

function reload() {

    if (
        ammo >= 30 ||
        reserve <= 0
    ) return;


    const needed =
        30 - ammo;


    const amount =
        Math.min(
            needed,
            reserve
        );


    ammo += amount;

    reserve -= amount;


    updateHUD();
}


/* =====================================================
   HUD
===================================================== */

function updateHUD() {

    document.getElementById(
        "health"
    ).textContent =
        Math.floor(health);


    document.getElementById(
        "kills"
    ).textContent =
        kills;


    document.getElementById(
        "bots"
    ).textContent =
        enemies.length;


    document.getElementById(
        "ammo"
    ).textContent =
        ammo +
        " / " +
        reserve;
}


/* =====================================================
   СМЕРТЬ
===================================================== */

function playerDeath() {

    dead = true;

    document.exitPointerLock();


    alert(
        "Вы погибли!\n\n" +
        "Убийств: " +
        kills
    );


    location.reload();
}


/* =====================================================
   СОБЫТИЯ
===================================================== */

function createEvents() {


    window.addEventListener(
        "resize",
        () => {

            camera.aspect =
                innerWidth /
                innerHeight;


            camera.updateProjectionMatrix();


            renderer.setSize(
                innerWidth,
                innerHeight
            );
        }
    );


    document.addEventListener(
        "keydown",
        event => {

            keys[event.code] = true;


            if (
                event.code === "KeyR"
            ) {

                reload();
            }
        }
    );


    document.addEventListener(
        "keyup",
        event => {

            keys[event.code] = false;
        }
    );


    document.addEventListener(
        "mousemove",
        event => {

            if (
                document.pointerLockElement !==
                document.body
            ) return;


            yaw -=
                event.movementX *
                .002;


            pitch -=
                event.movementY *
                .002;


            pitch =
                Math.max(
                    -1.4,
                    Math.min(
                        1.4,
                        pitch
                    )
                );


            camera.rotation.order =
                "YXZ";


            camera.rotation.y =
                yaw;


            camera.rotation.x =
                pitch;
        }
    );


    document.addEventListener(
        "mousedown",
        event => {

            if (
                event.button === 0
            ) {

                shoot();
            }


            if (
                document.pointerLockElement !==
                document.body
            ) {

                document.body.requestPointerLock();
            }
        }
    );
}


/* =====================================================
   GAME LOOP
===================================================== */

function animate() {

    requestAnimationFrame(
        animate
    );


    if (
        !started ||
        dead
    ) return;


    updatePlayer();

    updateBots();

    renderer.render(
        scene,
        camera
    );
}

</script>

</body>
</html>
