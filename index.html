<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tactical Strike 3D</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
    user-select: none;
}

#game {
    width: 100vw;
    height: 100vh;
}

#menu {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        linear-gradient(#0009, #0009),
        radial-gradient(circle at center, #283747, #080a0c 70%);
    color: white;
}

.menu-box {
    width: 450px;
    padding: 40px;
    background: #101418ee;
    border: 1px solid #65717d;
    box-shadow: 0 20px 80px #000;
    text-align: center;
}

.menu-box h1 {
    margin: 0;
    font-size: 50px;
    letter-spacing: 5px;
}

.menu-box p {
    color: #aab4bd;
}

.menu-box button {
    width: 100%;
    padding: 16px;
    margin-top: 20px;
    border: 0;
    background: #d69b22;
    color: #111;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
}

.menu-box button:hover {
    background: #f1b52f;
}

#hud {
    position: fixed;
    inset: 0;
    z-index: 20;
    pointer-events: none;
    display: none;
    color: white;
}

#crosshair {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    font-size: 28px;
    font-weight: bold;
}

#stats {
    position: absolute;
    left: 25px;
    bottom: 25px;
    padding: 15px 20px;
    background: #0009;
    border-left: 4px solid #d69b22;
    font-size: 19px;
    line-height: 1.7;
}

#ammoBox {
    position: absolute;
    right: 30px;
    bottom: 25px;
    text-align: right;
    background: #0009;
    padding: 15px 20px;
}

#ammo {
    font-size: 38px;
    font-weight: bold;
}

#weapon {
    position: absolute;
    left: 50%;
    bottom: -5px;
    transform: translateX(-50%);
    font-size: 100px;
    filter: drop-shadow(0 10px 10px #000);
}

#killFeed {
    position: absolute;
    right: 20px;
    top: 20px;
    text-align: right;
}

.kill {
    background: #0009;
    margin-bottom: 5px;
    padding: 7px 12px;
}

#damage {
    position: absolute;
    inset: 0;
    background: #f00;
    opacity: 0;
}

#dead {
    position: fixed;
    inset: 0;
    z-index: 90;
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    background: #000b;
    color: white;
}

#dead h1 {
    font-size: 70px;
    color: #d22;
}

#dead button {
    padding: 15px 50px;
    font-size: 20px;
    cursor: pointer;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="menu">
    <div class="menu-box">
        <h1>TACTICAL STRIKE</h1>
        <p>3D TACTICAL FPS</p>

        <button onclick="startGame()">
            НАЧАТЬ ИГРУ
        </button>

        <p>
            WASD — движение<br>
            SHIFT — бег<br>
            Мышь — обзор<br>
            ЛКМ — стрельба<br>
            R — перезарядка<br>
            ESC — освободить мышь
        </p>
    </div>
</div>

<div id="hud">

    <div id="crosshair">+</div>

    <div id="stats">
        ❤️ <span id="health">100</span><br>
        ☠ Убийства: <span id="kills">0</span><br>
        🤖 Ботов на карте: <span id="botCount">0</span>
    </div>

    <div id="ammoBox">
        <div id="ammo">30 / 90</div>
        <div>R — перезарядка</div>
    </div>

    <div id="weapon">🔫</div>

    <div id="killFeed"></div>

    <div id="damage"></div>
</div>

<div id="dead">
    <h1>ВЫ ПОГИБЛИ</h1>
    <p id="deathStats"></p>
    <button onclick="location.reload()">
        ИГРАТЬ СНОВА
    </button>
</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";


// ======================================================
// НАСТРОЙКИ
// ======================================================

const WORLD_SIZE = 70;

const PLAYER_RADIUS = 0.45;

const BOT_RADIUS = 0.45;

const BOT_MAX = 12;

const BULLET_DAMAGE = 50;

const MAGAZINE = 30;


// ======================================================
// THREE.JS
// ======================================================

let scene;
let camera;
let renderer;

let clock;

let walls = [];
let bots = [];

let gameStarted = false;
let gameOver = false;

let keys = {};

let health = 100;

let kills = 0;

let ammo = MAGAZINE;
let reserveAmmo = 90;

let shooting = false;
let reloading = false;

let yaw = 0;
let pitch = 0;


// ======================================================
// КАРТА
// ======================================================

const map = [

    // внешние стены

    {x:0,z:-34,w:68,d:2},
    {x:0,z:34,w:68,d:2},
    {x:-34,z:0,w:2,d:68},
    {x:34,z:0,w:2,d:68},

    // внутренние стены

    {x:-14,z:-20,w:2,d:20},
    {x:14,z:-20,w:2,d:20},

    {x:-14,z:20,w:2,d:20},
    {x:14,z:20,w:2,d:20},

    {x:-25,z:0,w:18,d:2},
    {x:25,z:0,w:18,d:2},

    {x:0,z:-10,w:18,d:2},
    {x:0,z:10,w:18,d:2},

    {x:-5,z:-24,w:2,d:10},
    {x:5,z:24,w:2,d:10}
];


// ======================================================
// START
// ======================================================

window.startGame = function() {

    document.getElementById("menu").style.display = "none";

    document.getElementById("hud").style.display = "block";

    gameStarted = true;

    init();

    document.body.requestPointerLock();
};


// ======================================================
// INIT
// ======================================================

function init() {

    scene = new THREE.Scene();

    scene.background =
        new THREE.Color(0x101418);

    scene.fog =
        new THREE.Fog(
            0x101418,
            10,
            65
        );


    camera =
        new THREE.PerspectiveCamera(
            75,
            innerWidth / innerHeight,
            0.05,
            200
        );


    camera.position.set(
        0,
        1.7,
        27
    );


    renderer =
        new THREE.WebGLRenderer({
            antialias:true
        });

    renderer.setSize(
        innerWidth,
        innerHeight
    );

    renderer.shadowMap.enabled = true;

    renderer.shadowMap.type =
        THREE.PCFSoftShadowMap;


    document
        .getElementById("game")
        .appendChild(renderer.domElement);


    clock = new THREE.Clock();


    createLights();

    createFloor();

    createMap();

    spawnInitialBots();


    addEvents();

    animate();
}


// ======================================================
// СВЕТ
// ======================================================

function createLights() {

    const ambient =
        new THREE.HemisphereLight(
            0x8899aa,
            0x222222,
            1.4
        );

    scene.add(ambient);


    const light =
        new THREE.DirectionalLight(
            0xffffff,
            1.2
        );

    light.position.set(
        10,
        30,
        10
    );

    light.castShadow = true;

    light.shadow.mapSize.width = 2048;

    light.shadow.mapSize.height = 2048;

    scene.add(light);


    // лампы

    for (
        let x = -25;
        x <= 25;
        x += 12
    ) {

        for (
            let z = -25;
            z <= 25;
            z += 12
        ) {

            const l =
                new THREE.PointLight(
                    0xffc477,
                    5,
                    14
                );

            l.position.set(
                x,
                4.5,
                z
            );

            scene.add(l);
        }
    }
}


// ======================================================
// ПОЛ
// ======================================================

function createFloor() {

    const geometry =
        new THREE.PlaneGeometry(
            WORLD_SIZE,
            WORLD_SIZE
        );

    const material =
        new THREE.MeshStandardMaterial({
            color:0x3b3d3f,
            roughness:0.9
        });

    const floor =
        new THREE.Mesh(
            geometry,
            material
        );

    floor.rotation.x =
        -Math.PI / 2;

    floor.receiveShadow = true;

    scene.add(floor);


    // сетка пола

    const grid =
        new THREE.GridHelper(
            WORLD_SIZE,
            35,
            0x555555,
            0x333333
        );

    grid.position.y = 0.01;

    scene.add(grid);
}


// ======================================================
// СТЕНЫ
// ======================================================

function createMap() {

    for (const data of map) {

        const geometry =
            new THREE.BoxGeometry(
                data.w,
                4,
                data.d
            );

        const material =
            new THREE.MeshStandardMaterial({
                color:0x596067,
                roughness:0.8
            });

        const wall =
            new THREE.Mesh(
                geometry,
                material
            );

        wall.position.set(
            data.x,
            2,
            data.z
        );

        wall.castShadow = true;

        wall.receiveShadow = true;

        scene.add(wall);

        walls.push({
            mesh:wall,
            x:data.x,
            z:data.z,
            w:data.w,
            d:data.d
        });
    }
}


// ======================================================
// БОТ
// ======================================================

function createBot(x,z) {

    const bot =
        new THREE.Group();


    // =========================
    // НОГИ
    // =========================

    const pantsMaterial =
        new THREE.MeshStandardMaterial({
            color:0x20252a
        });


    const leg1 =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .38,
                1.1,
                .42
            ),
            pantsMaterial
        );

    leg1.position.set(
        -.25,
        .55,
        0
    );


    const leg2 =
        leg1.clone();

    leg2.position.x =
        .25;


    bot.add(leg1);
    bot.add(leg2);


    // =========================
    // ТЕЛО
    // =========================

    const shirtMaterial =
        new THREE.MeshStandardMaterial({
            color:
                Math.random() > .5
                ? 0x283c50
                : 0x4c3b2a
        });


    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.05,
                1.45,
                .6
            ),
            shirtMaterial
        );

    body.position.y =
        1.65;

    body.castShadow = true;

    bot.add(body);


    // =========================
    // БРОНЕЖИЛЕТ
    // =========================

    const armor =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .9,
                .9,
                .65
            ),
            new THREE.MeshStandardMaterial({
                color:0x30363c,
                metalness:.3
            })
        );

    armor.position.set(
        0,
        1.7,
        -.05
    );

    bot.add(armor);


    // =========================
    // ГОЛОВА
    // =========================

    const head =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .42,
                16,
                12
            ),
            new THREE.MeshStandardMaterial({
                color:0xc68662
            })
        );

    head.position.y =
        2.65;

    head.castShadow = true;

    bot.add(head);


    // =========================
    // ВОЛОСЫ
    // =========================

    const hair =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .44,
                16,
                8,
                0,
                Math.PI * 2,
                0,
                Math.PI / 2
            ),
            new THREE.MeshStandardMaterial({
                color:0x191919
            })
        );

    hair.position.y =
        2.78;

    bot.add(hair);


    // =========================
    // ГЛАЗА
    // =========================

    const eyeMaterial =
        new THREE.MeshBasicMaterial({
            color:0x222222
        });


    const eye1 =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .045,
                8,
                8
            ),
            eyeMaterial
        );

    eye1.position.set(
        -.15,
        2.66,
        -.38
    );


    const eye2 =
        eye1.clone();

    eye2.position.x =
        .15;


    bot.add(eye1);
    bot.add(eye2);


    // =========================
    // РОТ
    // =========================

    const mouth =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .2,
                .04,
                .03
            ),
            new THREE.MeshBasicMaterial({
                color:0x321818
            })
        );

    mouth.position.set(
        0,
        2.48,
        -.39
    );

    bot.add(mouth);


    // =========================
    // РУКИ
    // =========================

    const armMaterial =
        new THREE.MeshStandardMaterial({
            color:0xc68662
        });


    const arm1 =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .28,
                1.1,
                .28
            ),
            armMaterial
        );

    arm1.position.set(
        -.7,
        1.65,
        -.05
    );

    arm1.rotation.z =
        -.15;


    const arm2 =
        arm1.clone();

    arm2.position.x =
        .7;

    arm2.rotation.z =
        .15;


    bot.add(arm1);
    bot.add(arm2);


    // =========================
    // ОРУЖИЕ
    // =========================

    const gun =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .25,
                .25,
                1.3
            ),
            new THREE.MeshStandardMaterial({
                color:0x111111,
                metalness:.7
            })
        );

    gun.position.set(
        0,
        1.45,
        -.65
    );

    gun.rotation.x =
        Math.PI / 2;

    bot.add(gun);


    // =========================
    // ДАННЫЕ AI
    // =========================

    bot.position.set(
        x,
        0,
        z
    );

    bot.userData.health = 100;

    bot.userData.state = "patrol";

    bot.userData.target =
        new THREE.Vector3();

    bot.userData.lastShot = 0;

    bot.userData.speed =
        .035 + Math.random() * .015;

    bot.userData.path = [];

    bot.userData.pathIndex = 0;

    bot.userData.nextThink = 0;


    scene.add(bot);

    bots.push(bot);

    updateBotCount();
}


// ======================================================
// ПОИСК СВОБОДНОГО МЕСТА
// ======================================================

function randomFreePosition() {

    for (let i = 0; i < 100; i++) {

        const x =
            -28 + Math.random() * 56;

        const z =
            -28 + Math.random() * 56;


        if (
            !collidesWithWall(
                x,
                z,
                BOT_RADIUS
            )
        ) {

            return {
                x,
                z
            };
        }
    }

    return {
        x:0,
        z:0
    };
}


// ======================================================
// БЕСКОНЕЧНЫЕ БОТЫ
// ======================================================

function spawnInitialBots() {

    for (
        let i = 0;
        i < 8;
        i++
    ) {

        const pos =
            randomFreePosition();

        createBot(
            pos.x,
            pos.z
        );
    }
}


// ======================================================
// SPAWN НОВОГО БОТА
// ======================================================

function spawnBot() {

    if (gameOver) return;

    const pos =
        randomFreePosition();

    createBot(
        pos.x,
        pos.z
    );
}


// ======================================================
// КОЛЛИЗИЯ СО СТЕНОЙ
// ======================================================

function collidesWithWall(
    x,
    z,
    radius
) {

    for (const wall of walls) {

        const minX =
            wall.x -
            wall.w / 2 -
            radius;

        const maxX =
            wall.x +
            wall.w / 2 +
            radius;

        const minZ =
            wall.z -
            wall.d / 2 -
            radius;

        const maxZ =
            wall.z +
            wall.d / 2 +
            radius;


        if (
            x > minX &&
            x < maxX &&
            z > minZ &&
            z < maxZ
        ) {

            return true;
        }
    }

    return false;
}


// ======================================================
// ДВИЖЕНИЕ С КОЛЛИЗИЯМИ
// ======================================================

function moveWithCollision(
    object,
    dx,
    dz,
    radius
) {

    const nx =
        object.position.x + dx;

    const nz =
        object.position.z + dz;


    // X

    if (
        !collidesWithWall(
            nx,
            object.position.z,
            radius
        )
    ) {

        object.position.x = nx;
    }


    // Z

    if (
        !collidesWithWall(
            object.position.x,
            nz,
            radius
        )
    ) {

        object.position.z = nz;
    }
}


// ======================================================
// LINE OF SIGHT
// ======================================================

function canSeePlayer(bot) {

    const start =
        bot.position.clone();

    start.y = 1.7;


    const end =
        camera.position.clone();


    const direction =
        end.clone().sub(start);

    const distance =
        direction.length();

    direction.normalize();


    const ray =
        new THREE.Raycaster(
            start,
            direction,
            0,
            distance
        );


    const wallMeshes =
        walls.map(w => w.mesh);


    const hits =
        ray.intersectObjects(
            wallMeshes,
            false
        );


    return hits.length === 0;
}


// ======================================================
// AI БОТА
// ======================================================

function updateBot(bot, delta) {

    if (gameOver) return;


    const distance =
        bot.position.distanceTo(
            camera.position
        );


    // =========================
    // УВИДЕЛ ИГРОКА
    // =========================

    if (
        distance < 25 &&
        canSeePlayer(bot)
    ) {

        bot.userData.state =
            "attack";
    }


    // =========================
    // АТАКА
    // =========================

    if (
        bot.userData.state ===
        "attack"
    ) {

        const target =
            camera.position.clone();

        target.y = 0;


        const direction =
            target
                .sub(bot.position);

        const dist =
            direction.length();


        direction.normalize();


        // Повернуться к игроку

        bot.lookAt(
            camera.position.x,
            bot.position.y,
            camera.position.z
        );


        // Подойти

        if (dist > 7) {

            moveWithCollision(
                bot,
                direction.x *
                bot.userData.speed,
                direction.z *
                bot.userData.speed,
                BOT_RADIUS
            );
        }


        // Стрельба

        const now =
            performance.now();


        if (
            dist < 22 &&
            canSeePlayer(bot) &&
            now -
            bot.userData.lastShot >
            900
        ) {

            bot.userData.lastShot =
                now;

            botShoot(bot);
        }


        // Потерял игрока

        if (
            dist > 30 ||
            !canSeePlayer(bot)
        ) {

            bot.userData.state =
                "search";

            bot.userData.target =
                camera.position.clone();
        }

        return;
    }


    // =========================
    // ПОИСК
    // =========================

    if (
        bot.userData.state ===
        "search"
    ) {

        const target =
            bot.userData.target;

        const direction =
            target.clone()
                .sub(bot.position);

        direction.y = 0;

        const distance =
            direction.length();


        if (distance > 1) {

            direction.normalize();

            moveWithCollision(
                bot,
                direction.x *
                bot.userData.speed,
                direction.z *
                bot.userData.speed,
                BOT_RADIUS
            );

        } else {

            bot.userData.state =
                "patrol";
        }


        return;
    }


    // =========================
    // ПАТРУЛЬ
    // =========================

    if (
        bot.userData.state ===
        "patrol"
    ) {

        if (
            !bot.userData.target ||
            bot.position.distanceTo(
                bot.userData.target
            ) < 1
        ) {

            const pos =
                randomFreePosition();

            bot.userData.target =
                new THREE.Vector3(
                    pos.x,
                    0,
                    pos.z
                );
        }


        const direction =
            bot.userData.target
                .clone()
                .sub(bot.position);

        direction.y = 0;

        direction.normalize();


        moveWithCollision(
            bot,
            direction.x *
            bot.userData.speed *
            .5,
            direction.z *
            bot.userData.speed *
            .5,
            BOT_RADIUS
        );


        bot.lookAt(
            bot.userData.target.x,
            bot.position.y,
            bot.userData.target.z
        );
    }
}


// ======================================================
// СТРЕЛЬБА БОТА
// ======================================================

function botShoot(bot) {

    const distance =
        bot.position.distanceTo(
            camera.position
        );


    // Чем дальше бот,
    // тем меньше вероятность попадания

    let chance =
        Math.max(
            .15,
            1 -
            distance / 30
        );


    if (
        Math.random() <
        chance
    ) {

        const damage =
            5 +
            Math.random() * 8;

        damagePlayer(damage);
    }
}


// ======================================================
// УРОН ИГРОКУ
// ======================================================

function damagePlayer(amount) {

    if (gameOver) return;

    health -= amount;

    health =
        Math.max(
            0,
            health
        );


    const damage =
        document.getElementById(
            "damage"
        );

    damage.style.opacity = ".35";

    setTimeout(() => {

        damage.style.opacity = "0";

    }, 100);


    updateHUD();


    if (health <= 0) {

        playerDeath();
    }
}


// ======================================================
// СТРЕЛЬБА ИГРОКА
// ======================================================

function shoot() {

    if (
        !gameStarted ||
        gameOver ||
        reloading
    ) return;


    if (ammo <= 0) {

        reload();

        return;
    }


    ammo--;

    updateHUD();


    // отдача

    pitch -= .015;


    // луч

    const ray =
        new THREE.Raycaster();


    ray.setFromCamera(
        new THREE.Vector2(0,0),
        camera
    );


    const objects = [];


    for (const bot of bots) {

        bot.traverse(
            child => {

                if (
                    child.isMesh
                ) {

                    objects.push(
                        child
                    );
                }
            }
        );
    }


    const hits =
        ray.intersectObjects(
            objects,
            true
        );


    if (
        hits.length > 0
    ) {

        let bot =
            hits[0].object;


        while (
            bot &&
            !bots.includes(bot)
        ) {

            bot =
                bot.parent;
        }


        if (bot) {

            bot.userData.health -=
                BULLET_DAMAGE;


            // эффект попадания

            bot.position.y += .05;


            if (
                bot.userData.health <= 0
            ) {

                killBot(bot);
            }
        }
    }
}


// ======================================================
// УБИЙСТВО БОТА
// ======================================================

function killBot(bot) {

    scene.remove(bot);

    bots =
        bots.filter(
            b => b !== bot
        );


    kills++;

    updateHUD();

    addKillFeed();


    // Новый бот через время

    setTimeout(() => {

        if (
            gameStarted &&
            !gameOver
        ) {

            spawnBot();
        }

    }, 1200);
}


// ======================================================
// KILL FEED
// ======================================================

function addKillFeed() {

    const feed =
        document.getElementById(
            "killFeed"
        );


    const item =
        document.createElement(
            "div"
        );

    item.className = "kill";

    item.textContent =
        "☠ YOU → BOT";


    feed.appendChild(item);


    setTimeout(() => {

        item.remove();

    }, 2500);
}


// ======================================================
// ПЕРЕЗАРЯДКА
// ======================================================

function reload() {

    if (
        reloading ||
        ammo === MAGAZINE ||
        reserveAmmo <= 0
    ) return;


    reloading = true;


    setTimeout(() => {

        const needed =
            MAGAZINE - ammo;

        const loaded =
            Math.min(
                needed,
                reserveAmmo
            );


        ammo += loaded;

        reserveAmmo -= loaded;

        reloading = false;

        updateHUD();

    }, 1400);
}


// ======================================================
// ИГРОК
// ======================================================

function updatePlayer(delta) {

    const speed =
        keys["ShiftLeft"] ||
        keys["ShiftRight"]
        ? .16
        : .09;


    const forward =
        new THREE.Vector3();

    camera.getWorldDirection(
        forward
    );

    forward.y = 0;

    forward.normalize();


    const right =
        new THREE.Vector3();

    right.crossVectors(
        forward,
        camera.up
    );

    right.normalize();


    let dx = 0;
    let dz = 0;


    if (
        keys["KeyW"]
    ) {

        dx +=
            forward.x * speed;

        dz +=
            forward.z * speed;
    }


    if (
        keys["KeyS"]
    ) {

        dx -=
            forward.x * speed;

        dz -=
            forward.z * speed;
    }


    if (
        keys["KeyA"]
    ) {

        dx -=
            right.x * speed;

        dz -=
            right.z * speed;
    }


    if (
        keys["KeyD"]
    ) {

        dx +=
            right.x * speed;

        dz +=
            right.z * speed;
    }


    moveWithCollision(
        camera,
        dx,
        dz,
        PLAYER_RADIUS
    );


    camera.position.y =
        1.7;
}


// ======================================================
// HUD
// ======================================================

function updateHUD() {

    document.getElementById(
        "health"
    ).textContent =
        Math.floor(health);


    document.getElementById(
        "kills"
    ).textContent =
        kills;


    document.getElementById(
        "botCount"
    ).textContent =
        bots.length;


    document.getElementById(
        "ammo"
    ).textContent =
        ammo +
        " / " +
        reserveAmmo;
}


// ======================================================
// СМЕРТЬ
// ======================================================

function playerDeath() {

    gameOver = true;

    document.exitPointerLock();


    document.getElementById(
        "dead"
    ).style.display =
        "flex";


    document.getElementById(
        "deathStats"
    ).textContent =
        "Убийств: " +
        kills;
}


// ======================================================
// СОБЫТИЯ
// ======================================================

function addEvents() {

    window.addEventListener(
        "resize",
        () => {

            camera.aspect =
                innerWidth /
                innerHeight;

            camera.updateProjectionMatrix();

            renderer.setSize(
                innerWidth,
                innerHeight
            );
        }
    );


    document.addEventListener(
        "keydown",
        e => {

            keys[e.code] = true;


            if (
                e.code === "KeyR"
            ) {

                reload();
            }
        }
    );


    document.addEventListener(
        "keyup",
        e => {

            keys[e.code] = false;
        }
    );


    document.addEventListener(
        "mousemove",
        e => {

            if (
                document.pointerLockElement !==
                document.body
            ) return;


            yaw -=
                e.movementX *
                .002;

            pitch -=
                e.movementY *
                .002;


            pitch =
                Math.max(
                    -1.45,
                    Math.min(
                        1.45,
                        pitch
                    )
                );


            camera.rotation.order =
                "YXZ";

            camera.rotation.y =
                yaw;

            camera.rotation.x =
                pitch;
        }
    );


    document.addEventListener(
        "mousedown",
        e => {

            if (
                e.button === 0
            ) {

                shoot();
            }

            if (
                document.pointerLockElement !==
                document.body
            ) {

                document.body.requestPointerLock();
            }
        }
    );
}


// ======================================================
// GAME LOOP
// ======================================================

function animate() {

    requestAnimationFrame(
        animate
    );


    if (
        !gameStarted ||
        gameOver
    ) {

        return;
    }


    const delta =
        clock.getDelta();


    updatePlayer(delta);


    for (
        const bot of [...bots]
    ) {

        updateBot(
            bot,
            delta
        );
    }


    updateHUD();


    renderer.render(
        scene,
        camera
    );
}

</script>
