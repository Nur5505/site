<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOOM 3D</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        overflow: hidden;
        background: #000;
        font-family: Arial, sans-serif;
        color: white;
    }

    #game {
        width: 100vw;
        height: 100vh;
    }

    #menu {
        position: fixed;
        inset: 0;
        z-index: 10;
        background:
            radial-gradient(circle at center, #451010 0%, #120000 55%, #000 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
    }

    .menu-box {
        width: 420px;
        padding: 40px;
        background: rgba(0,0,0,.75);
        border: 2px solid #8b0000;
        box-shadow: 0 0 40px #ff000044;
    }

    h1 {
        margin: 0 0 10px;
        font-size: 60px;
        color: #d71919;
        text-shadow: 4px 4px #000;
        letter-spacing: 5px;
    }

    h2 {
        margin-top: 0;
        color: #aaa;
    }

    button {
        width: 100%;
        padding: 16px;
        margin-top: 15px;
        background: #8b0000;
        color: white;
        border: 2px solid #d22;
        font-size: 20px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #c00000;
    }

    #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 5;
        display: none;
    }

    #crosshair {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        font-size: 30px;
        color: white;
        text-shadow: 0 0 5px black;
    }

    #stats {
        position: absolute;
        left: 20px;
        bottom: 20px;
        background: rgba(0,0,0,.7);
        border: 2px solid #555;
        padding: 15px 25px;
        font-size: 20px;
    }

    #weapon {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 100px;
        filter: drop-shadow(0 0 10px black);
    }

    #message {
        position: absolute;
        top: 20%;
        width: 100%;
        text-align: center;
        font-size: 40px;
        color: red;
        font-weight: bold;
        text-shadow: 3px 3px black;
    }

    #controls {
        color: #aaa;
        margin-top: 20px;
        line-height: 1.7;
    }
</style>
</head>

<body>

<div id="game"></div>

<div id="menu">
    <div class="menu-box">
        <h1>DOOM</h1>
        <h2>WEB EDITION</h2>

        <button onclick="startGame()">НАЧАТЬ ИГРУ</button>

        <div id="controls">
            WASD — движение<br>
            Мышь — обзор<br>
            ЛКМ — стрелять<br>
            R — перезарядка<br>
            ESC — освободить мышь
        </div>
    </div>
</div>

<div id="hud">

    <div id="crosshair">+</div>

    <div id="message"></div>

    <div id="stats">
        ❤️ Здоровье: <span id="health">100</span><br>
        🔫 Патроны: <span id="ammo">12</span><br>
        👹 Убито: <span id="kills">0</span>
    </div>

    <div id="weapon">🔫</div>

</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";


// =========================
// ОСНОВНЫЕ НАСТРОЙКИ
// =========================

let scene;
let camera;
let renderer;

let player;
let enemies = [];

let health = 100;
let ammo = 12;
let kills = 0;

let gameStarted = false;
let gameOver = false;

let keys = {};

let mouseX = 0;
let mouseY = 0;

let canShoot = true;


// =========================
// ЗАПУСК ИГРЫ
// =========================

window.startGame = function () {

    document.getElementById("menu").style.display = "none";
    document.getElementById("hud").style.display = "block";

    gameStarted = true;

    init();

    document.body.requestPointerLock();
};


// =========================
// СОЗДАНИЕ СЦЕНЫ
// =========================

function init() {

    scene = new THREE.Scene();

    scene.background = new THREE.Color(0x080808);

    scene.fog = new THREE.Fog(
        0x080808,
        10,
        55
    );


    // КАМЕРА

    camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
    );

    camera.position.set(0, 1.7, 8);


    // РЕНДЕР

    renderer = new THREE.WebGLRenderer({
        antialias: true
    });

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.shadowMap.enabled = true;

    document
        .getElementById("game")
        .appendChild(renderer.domElement);


    // СВЕТ

    const ambient = new THREE.AmbientLight(
        0x555555,
        1
    );

    scene.add(ambient);


    const redLight = new THREE.PointLight(
        0xff2200,
        8,
        30
    );

    redLight.position.set(
        0,
        5,
        0
    );

    scene.add(redLight);


    // ПОЛ

    const floorGeometry =
        new THREE.PlaneGeometry(
            60,
            60
        );

    const floorMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x252525
        });

    const floor =
        new THREE.Mesh(
            floorGeometry,
            floorMaterial
        );

    floor.rotation.x = -Math.PI / 2;

    floor.receiveShadow = true;

    scene.add(floor);


    // ПОТОЛОК

    const ceiling =
        new THREE.Mesh(
            new THREE.PlaneGeometry(60, 60),
            new THREE.MeshStandardMaterial({
                color: 0x090909
            })
        );

    ceiling.rotation.x = Math.PI / 2;
    ceiling.position.y = 6;

    scene.add(ceiling);


    // СТЕНЫ

    createWall(0, 3, -25, 50, 6);
    createWall(0, 3, 25, 50, 6);

    createWall(-25, 3, 0, 6, 50);
    createWall(25, 3, 0, 6, 50);


    // ВНУТРЕННИЕ СТЕНЫ

    createWall(-8, 3, -10, 18, 6);
    createWall(8, 3, -5, 18, 6);

    createWall(-8, 3, 10, 18, 6);
    createWall(8, 3, 15, 18, 6);


    // КОЛОННЫ

    for (let i = -20; i <= 20; i += 10) {

        createColumn(
            i,
            -18
        );

        createColumn(
            i,
            18
        );
    }


    // ВРАГИ

    createEnemy(-10, -5);
    createEnemy(10, -12);
    createEnemy(-15, 10);
    createEnemy(15, 5);
    createEnemy(0, -18);


    // СОБЫТИЯ

    window.addEventListener(
        "resize",
        onResize
    );

    document.addEventListener(
        "keydown",
        e => {
            keys[e.code] = true;

            if (e.code === "KeyR") {
                reload();
            }
        }
    );

    document.addEventListener(
        "keyup",
        e => {
            keys[e.code] = false;
        }
    );

    document.addEventListener(
        "mousemove",
        mouseMove
    );

    document.addEventListener(
        "mousedown",
        shoot
    );


    animate();
}


// =========================
// СОЗДАНИЕ СТЕНЫ
// =========================

function createWall(
    x,
    y,
    z,
    width,
    height
) {

    const geometry =
        new THREE.BoxGeometry(
            width,
            height,
            1
        );

    const material =
        new THREE.MeshStandardMaterial({
            color: 0x3a3030
        });

    const wall =
        new THREE.Mesh(
            geometry,
            material
        );

    wall.position.set(
        x,
        y,
        z
    );

    wall.castShadow = true;
    wall.receiveShadow = true;

    scene.add(wall);
}


// =========================
// КОЛОННА
// =========================

function createColumn(x, z) {

    const geometry =
        new THREE.BoxGeometry(
            2,
            6,
            2
        );

    const material =
        new THREE.MeshStandardMaterial({
            color: 0x454545
        });

    const column =
        new THREE.Mesh(
            geometry,
            material
        );

    column.position.set(
        x,
        3,
        z
    );

    column.castShadow = true;

    scene.add(column);
}


// =========================
// СОЗДАНИЕ ДЕМОНА
// =========================

function createEnemy(x, z) {

    const enemy =
        new THREE.Group();


    // ТЕЛО

    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.3,
                1.8,
                0.8
            ),
            new THREE.MeshStandardMaterial({
                color: 0x7a2020
            })
        );

    body.position.y = 1.4;

    enemy.add(body);


    // ГОЛОВА

    const head =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                0.65,
                16,
                16
            ),
            new THREE.MeshStandardMaterial({
                color: 0x9b3030
            })
        );

    head.position.y = 2.7;

    enemy.add(head);


    // ГЛАЗА

    const eyeMaterial =
        new THREE.MeshBasicMaterial({
            color: 0xff0000
        });


    const eye1 =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                0.09,
                8,
                8
            ),
            eyeMaterial
        );

    eye1.position.set(
        -0.22,
        2.75,
        -0.57
    );


    const eye2 =
        eye1.clone();

    eye2.position.x = 0.22;


    enemy.add(eye1);
    enemy.add(eye2);


    // ПОЛОЖЕНИЕ

    enemy.position.set(
        x,
        0,
        z
    );

    enemy.userData.health = 100;

    enemy.userData.speed =
        0.015 + Math.random() * 0.01;

    scene.add(enemy);

    enemies.push(enemy);
}


// =========================
// УПРАВЛЕНИЕ МЫШЬЮ
// =========================

function mouseMove(e) {

    if (!gameStarted ||
        document.pointerLockElement !== document.body) {
        return;
    }

    camera.rotation.y -=
        e.movementX * 0.002;

    camera.rotation.x -=
        e.movementY * 0.002;


    camera.rotation.x =
        Math.max(
            -1.3,
            Math.min(
                1.3,
                camera.rotation.x
            )
        );
}


// =========================
// СТРЕЛЬБА
// =========================

function shoot() {

    if (!gameStarted ||
        gameOver ||
        !canShoot) {
        return;
    }

    if (ammo <= 0) {
        reload();
        return;
    }

    ammo--;

    updateHUD();

    canShoot = false;

    setTimeout(() => {
        canShoot = true;
    }, 250);


    // ЭФФЕКТ ВЫСТРЕЛА

    const weapon =
        document.getElementById("weapon");

    weapon.style.transform =
        "translateX(-50%) translateY(-20px)";

    setTimeout(() => {

        weapon.style.transform =
            "translateX(-50%)";

    }, 100);


    // ЛУЧ ИЗ КАМЕРЫ

    const raycaster =
        new THREE.Raycaster();

    raycaster.setFromCamera(
        new THREE.Vector2(0, 0),
        camera
    );


    const objects = [];

    enemies.forEach(enemy => {

        enemy.traverse(child => {

            if (child.isMesh) {
                objects.push(child);
            }

        });

    });


    const hits =
        raycaster.intersectObjects(
            objects,
            true
        );


    if (hits.length > 0) {

        let enemy =
            hits[0].object.parent;


        while (
            enemy &&
            !enemies.includes(enemy)
        ) {
            enemy = enemy.parent;
        }


        if (enemy) {

            enemy.userData.health -= 50;


            // Эффект попадания

            enemy.scale.set(
                1.2,
                1.2,
                1.2
            );

            setTimeout(() => {

                if (enemy) {
                    enemy.scale.set(
                        1,
                        1,
                        1
                    );
                }

            }, 100);


            if (
                enemy.userData.health <= 0
            ) {

                scene.remove(enemy);

                enemies =
                    enemies.filter(
                        e => e !== enemy
                    );

                kills++;

                updateHUD();
            }
        }
    }
}


// =========================
// ПЕРЕЗАРЯДКА
// =========================

function reload() {

    if (ammo < 12) {

        ammo = 12;

        updateHUD();
    }
}


// =========================
// ДВИЖЕНИЕ
// =========================

function movePlayer() {

    const speed = 0.12;

    const forward =
        new THREE.Vector3();

    camera.getWorldDirection(
        forward
    );

    forward.y = 0;

    forward.normalize();


    const right =
        new THREE.Vector3();

    right.crossVectors(
        forward,
        camera.up
    ).normalize();


    if (keys["KeyW"]) {

        camera.position.add(
            forward.clone().multiplyScalar(speed)
        );
    }

    if (keys["KeyS"]) {

        camera.position.add(
            forward.clone().multiplyScalar(-speed)
        );
    }

    if (keys["KeyA"]) {

        camera.position.add(
            right.clone().multiplyScalar(-speed)
        );
    }

    if (keys["KeyD"]) {

        camera.position.add(
            right.clone().multiplyScalar(speed)
        );
    }


    // Ограничение карты

    camera.position.x =
        THREE.MathUtils.clamp(
            camera.position.x,
            -22,
            22
        );

    camera.position.z =
        THREE.MathUtils.clamp(
            camera.position.z,
            -22,
            22
        );
}


// =========================
// ВРАГИ АТАКУЮТ
// =========================

function updateEnemies() {

    enemies.forEach(enemy => {

        const direction =
            new THREE.Vector3();

        direction.subVectors(
            camera.position,
            enemy.position
        );

        direction.y = 0;

        const distance =
            direction.length();

        direction.normalize();


        if (distance > 2) {

            enemy.position.add(
                direction.multiplyScalar(
                    enemy.userData.speed
                )
            );

            enemy.lookAt(
                camera.position.x,
                enemy.position.y,
                camera.position.z
            );

        } else {

            health -= 0.15;

            updateHUD();


            if (health <= 0) {

                endGame();
            }
        }
    });
}


// =========================
// HUD
// =========================

function updateHUD() {

    document.getElementById(
        "health"
    ).textContent =
        Math.max(
            0,
            Math.floor(health)
        );

    document.getElementById(
        "ammo"
    ).textContent =
        ammo;

    document.getElementById(
        "kills"
    ).textContent =
        kills;
}


// =========================
// GAME OVER
// =========================

function endGame() {

    gameOver = true;

    document.exitPointerLock();

    document.getElementById(
        "message"
    ).textContent =
        "💀 YOU DIED";

    setTimeout(() => {

        location.reload();

    }, 3000);
}


// =========================
// RESIZE
// =========================

function onResize() {

    camera.aspect =
        window.innerWidth /
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
}


// =========================
// ГЛАВНЫЙ ЦИКЛ
// =========================

function animate() {

    requestAnimationFrame(
        animate
    );


    if (!gameStarted ||
        gameOver) {
        return;
    }


    movePlayer();

    updateEnemies();


    renderer.render(
        scene,
        camera
    );
}

</script>

</body>
</html>
